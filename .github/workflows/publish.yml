name: Publish 📦

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install ⚡
        run: pnpm install --frozen-lockfile
      - name: Type check 🔍
        run: pnpm typecheck
      - name: Lint ✨
        run: pnpm lint
      - name: Check formatting 🎨
        run: pnpm format:check
      - name: Unit tests 🧪
        run: pnpm test:unit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v6
      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - name: Install ⚡
        run: pnpm install --frozen-lockfile
      - name: Build 🔨
        run: pnpm prepublishOnly
      - name: Publish 🚀
        run: pnpm publish --no-git-checks --provenance
