name: CI 🔧

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup PNPM 📦
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install ⚡
        run: pnpm install --frozen-lockfile

      - name: Type check 🔍
        run: pnpm typecheck

      - name: Lint ✨
        run: pnpm lint

      - name: Check formatting 🎨
        run: pnpm format:check

      - name: Build 🔨
        run: pnpm build

      - name: Unit tests 🧪
        run: pnpm test:unit
