name: E2E

on:
  pull_request:
    branches: [main, 3.x]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'
  pull_request_target:
    branches: [main, 3.x]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve:
    name: Approve fork PR
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: e2e-fork
    steps:
      - run: echo "Approved for ${{ github.event.pull_request.head.sha }}"

  e2e:
    name: Integration and browser tests
    needs: approve
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
        (github.event_name == 'pull_request_target' && needs.approve.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ github.event_name != 'pull_request_target' && 'pnpm' || '' }}

      - name: Write .env
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: |
          if [ -z "$E2E_ENV" ]; then
            echo "::error::E2E_ENV secret is not set"
            exit 1
          fi
          printf '%s' "$E2E_ENV" > .env

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Integration tests
        run: pnpm test:int

      - name: Browser e2e
        run: pnpm test:e2e
