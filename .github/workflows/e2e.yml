name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve:
    name: Approve fork PR
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    environment: e2e-fork
    steps:
      - run: echo "Approved for ${{ github.event.pull_request.head.sha }}"

  e2e:
    name: Integration and browser tests
    needs: approve
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && needs.approve.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: ${{ github.event_name != 'pull_request_target' && 'pnpm' || '' }}

      - name: Check credentials
        id: creds
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: |
          if [ -z "$E2E_ENV" ]; then
            echo "E2E_ENV secret is not set — skipping e2e." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env
        if: steps.creds.outputs.run == 'true'
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}
        run: printf '%s' "$E2E_ENV" > .env

      - if: steps.creds.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.creds.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Integration tests
        if: steps.creds.outputs.run == 'true'
        run: pnpm test

      - name: Browser e2e
        if: steps.creds.outputs.run == 'true'
        run: pnpm test:e2e
