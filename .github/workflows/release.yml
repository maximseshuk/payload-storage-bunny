name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^ 2>/dev/null || true)
          if [ -z "$prev" ] \
            || ! git diff --quiet "$prev" HEAD -- src tests pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json .github/workflows/e2e.yml \
            || [ "$(git show "$prev:package.json" | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' package.json)" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous tag: ${prev:-none}"

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    name: Verify, release, publish
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm build

      - name: Resolve changelog range
        id: range
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude 'v*-*' HEAD^ 2>/dev/null || true)
          if [[ "$GITHUB_REF_NAME" == *-* || -z "$prev" ]]; then
            echo "args=--latest" >> "$GITHUB_OUTPUT"
          else
            echo "args=$prev..$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: changelog
        with:
          config: cliff.toml
          args: ${{ steps.range.outputs.args }} --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve npm dist-tag
        id: dist
        run: |
          version=$(jq -r .version package.json)
          major=${version%%.*}
          if [[ "$version" == *-* ]]; then
            pre=${version#*-}
            tag=${pre%%.*}
          else
            latest=$(npm view "$(jq -r .name package.json)" dist-tags.latest 2>/dev/null || echo 0.0.0)
            if [ "$major" -lt "${latest%%.*}" ]; then tag="latest-$major"; else tag=latest; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "npm dist-tag: $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.content }}
          make_latest: ${{ steps.dist.outputs.tag == 'latest' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: pnpm publish --access public --provenance --no-git-checks --tag "$DIST_TAG"
